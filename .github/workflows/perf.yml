name: Performance harness

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday 06:00 UTC
    - cron: "0 6 * * 1"

jobs:
  perf-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @todo-task-app/perf exec playwright install chromium --with-deps

      - name: Run perf check
        env:
          PERF_EMAIL: ${{ secrets.PERF_EMAIL }}
          PERF_PASSWORD: ${{ secrets.PERF_PASSWORD }}
          PERF_BASE_URL: https://todo.sarl
          PERF_API_URL: https://api.todo.sarl
        run: pnpm perf:check

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: |
            perf/results/**
            perf/.lighthouseci/**
          if-no-files-found: warn
